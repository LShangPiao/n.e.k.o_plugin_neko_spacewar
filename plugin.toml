# 猫娘星海作战 —— 插件元数据
#
# 这是一个纯前端跑的像素风太空射击小游戏：战斗在插件自带的静态界面里进行，
# 插件后端只负责存档、战报推送和把主界面的战术指令转给游戏。
# 静态界面不需要插件进程存活也能打开（只读本地缓存），启动插件后才有存档与主界面联动。

[plugin]
id = "neko_spacewar"
name = "猫娘星海作战"
description = "像素风竖版太空射击小游戏：玩家驾驶猫耳级星舰，主界面的猫娘陪你一起打。她开无人机自动射击、听你下达护盾/集火/维修/猫猫星爆四种战术指令；难度随波数递增——敌人越往后越耐打、弹幕越密越快、每波敌机也更多；你在游戏里的机内通讯框说话，这句话会转给她本人，她的回话再出现在游戏画面里；开局、新一波、母舰出现或击破、装甲告急、高连击、本局结束时，游戏会触发她主动开口跟你说话，而且她看得到真实战况（击毁数、被击中次数、剩余敌机、母舰血量）不会乱编。每局结束战报会送到主界面，让她点评这一局。战斗在插件自带的静态界面里运行，不需要额外安装游戏。"
short_description = "和猫娘并肩打像素太空战：她真的会说话、开僚机、听你指挥，打完还点评战报"
keywords = [
    "太空", "星舰", "飞船", "射击", "像素", "小游戏", "游戏", "猫娘", "僚机", "空战",
    "街机", "弹幕", "战斗", "一起玩", "双人", "星际",
    "space", "shooter", "arcade", "pixel", "starship", "bullet hell",
    "スペース", "シューティング", "ゲーム", "宇宙", "우주", "슈팅", "게임",
]
version = "0.4.1"
type = "plugin"
entry = "plugin.plugins.neko_spacewar:NekoSpaceWarPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = false

[plugin_runtime]
enabled = true
# 战斗本身不占后端：插件只是给静态界面提供存档和消息通道，所以常驻启动没有空闲开销。
auto_start = true
timeout = 30

[plugin.ui]
enabled = true

[neko_spacewar]
# 游戏内显示的称呼（默认「猫娘」；填成你自己猫娘的名字会更自然）。
# 注意：这只影响游戏画面里的标签文字，说话的一直是主界面的她本人。
wingman_name = "猫娘"

# 首次打开游戏时的默认难度：easy / normal / hard。
# 玩家在游戏设置里改过之后，以存档里的设置为准。
difficulty = "normal"

# 首次打开游戏时是否默认自动开火（玩家仍可在游戏设置里切换）。
auto_fire = true

# 首次打开游戏时的音效 / 音乐开关（WebAudio 实时合成，不需要额外音频文件）。
sfx_enabled = true
music_enabled = true

# 首次打开游戏时是否把每局战报推送到主界面（猫娘会在主聊天里回应这一局）。
battle_sync_enabled = true

# 母舰出现/被击破、开局这类小事件是否额外推一条「只读」消息给主界面
# （只进上下文，不打断玩家；母舰事件会顺带出现在 HUD 通知面板）。
boss_comment_enabled = true

# 两局战报之间的最小间隔（秒），范围 0-600；0 表示不限制。
# 连打多局时防止主界面被战报刷屏。
report_cooldown_seconds = 20

# 是否允许主界面通过 LLM 工具（spacewar_command）向游戏内下达战术指令。
enable_llm_orders = true

# 机内通讯是否转给主界面的猫娘本人（由宿主模型用她自己的身份回应）。
# 关掉后游戏里的对话框还在，但不会再把话送出去。
llm_chat_enabled = true

# 开局、新一波、母舰出现/击破、装甲告急、高连击、本局结束等节点是否让她主动喊一句
# （同样由宿主模型生成；关键节点不受「两次搭话最小间隔」限制）。
llm_banter_enabled = true

# 两次主动搭话之间的最小间隔（秒），范围 0-600；0 表示不限制。
banter_cooldown_seconds = 25
